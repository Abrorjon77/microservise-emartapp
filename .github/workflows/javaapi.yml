name: JavaAPI CI
on:
  push:
    branches: [main]
    paths:
      - 'javaapi/**'
      - '.github/workflows/javaapi.yml'
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/emart-javaapi
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./javaapi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update config repo with new image tag
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/emart-javaapi
        run: |
          git clone https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/Abrorjon77/emart-k8s-config.git
          cd emart-k8s-config
          echo "Updating image to: $IMAGE_NAME:${{ github.sha }}"
          # Argo CD deploys helm/emart, so bump the tag on the line after this image's repository
          sed -i "\\|repository: $IMAGE_NAME\$|{n;s|tag: .*|tag: ${{ github.sha }}|;}" helm/emart/values.yaml
          grep -A1 "repository: $IMAGE_NAME\$" helm/emart/values.yaml | grep -q "tag: ${{ github.sha }}"
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add helm/emart/values.yaml
          git diff --staged --quiet || git commit -m "ci: update javaapi image to ${{ github.sha }}"
          git push